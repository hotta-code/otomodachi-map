<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おともだちMAP</title><link rel="stylesheet" href="style.css"></head><body>
<main class="page"><header><div class="sign"><h1>おともだちMAP</h1><p>ちいさなおともだちが、全国へ。</p></div><img src="assets/otomodachi.jpg"><div class="board">GOOD COFFEE<br>GOOD FRIENDS<br>GOOD DAYS ♡</div></header>
<section class="stats"><article>おともだちがいる都道府県<br><b id="pc">0</b> 都道府県</article><article>おともだち総数<br><b id="gt">0</b> 体</article></section>
<section class="grid"><aside class="panel"><h2>☕ 都道府県ごとのおともだち数</h2><div id="plist"></div><footer>全 <b id="pf">0</b> 都道府県</footer></aside>
<section class="map"><p>おともだちとめぐる、やさしい日本。</p><div id="tiles"></div><small>都道府県をタップして登録</small></section>
<aside><section class="panel"><h2>🌐 海外のおともだち</h2><div class="add"><input id="cn" placeholder="国・地域名"><input id="cc" type="number" min="1" value="1"><button id="ca">追加</button></div><div id="clist"></div><footer>全 <b id="cf">0</b> か国・地域</footer></section><section class="panel"><h2>☕ エリア別おともだち数</h2><div id="regions"></div><div class="totals">日本合計 <b id="jt">0体</b><br>海外合計 <b id="ot">0体</b></div></section></aside></section>
<section class="edit"><b id="selname">東京都</b><button id="minus">−</button><strong id="selcount">0</strong><button id="plus">＋</button></section>
<footer class="actions"><button id="reset">記録を初期化</button><button onclick="scrollTo(0,0)">通常表示に戻る</button><button onclick="print()">地図をPDF保存</button></footer></main>
<script src="data.js"></script><script src="app.js"></script></body></html>
